# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: F Prime ADXL355 Library
site_description: F Prime application-manager-driver support for the ADXL355 accelerometer

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Hardware integration: hardware-integration.md
  - Raspberry Pi 4 bench example: raspberry-pi-4.md
  - API reference: api.md
  - Setup and examples: setup-and-examples.md
  - Testing: testing.md
  - Requirements and verification: requirements-and-verification.md
  - Practice audit: practices-audit.md
  - Research: research.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
